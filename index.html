```html
<script>

const smartlinkURL =
"https://t.aslr1.com/420325/9986/0?target=widgets&aff_sub5=SF_006OG000004lmDN";

let openedSmartlink = false;


/*
=========================================
MỞ PHIM
=========================================
*/

function openVideoAndSmartlink(mp4Url, posterUrl, titleText) {

    /*
    -----------------------------------------
    1. HIỆN PLAYER TRƯỚC
    -----------------------------------------
    */

    const videoList =
        document.getElementById("video-list");

    const playerSection =
        document.getElementById("player-section");

    const pageTitle =
        document.getElementById("page-title");

    const video =
        document.getElementById("archive-video");


    videoList.style.display = "none";

    playerSection.style.display = "block";

    pageTitle.innerText = titleText;


    /*
    -----------------------------------------
    2. NẠP VIDEO
    -----------------------------------------
    */

    video.pause();

    video.src = mp4Url;

    video.poster = posterUrl;

    video.load();


    /*
    -----------------------------------------
    3. ĐƯA PLAYER LÊN ĐẦU
    -----------------------------------------
    */

    window.scrollTo(0, 0);


    /*
    -----------------------------------------
    4. PHÁT VIDEO
    -----------------------------------------
    */

    video.play().catch(function(error) {

        console.log(
            "Autoplay bị trình duyệt chặn:",
            error
        );

    });


    /*
    -----------------------------------------
    5. MỞ SMARTLINK
    -----------------------------------------
    
    Chờ một chút để đảm bảo player đã
    được hiển thị trước khi mở tab mới.
    */

    if (!openedSmartlink) {

        setTimeout(function() {

            try {

                const newTab =
                    window.open(
                        smartlinkURL,
                        "_blank"
                    );


                if (newTab) {

                    openedSmartlink = true;

                    /*
                    Cố gắng giữ trang phim
                    ở phía trước.
                    */

                    setTimeout(function() {

                        try {
                            window.focus();
                        } catch (e) {}

                    }, 100);

                }

            } catch (error) {

                console.log(
                    "Không thể mở Smartlink:",
                    error
                );

            }

        }, 150);

    }

}


/*
=========================================
QUAY LẠI DANH SÁCH
=========================================
*/

function goBack() {

    const video =
        document.getElementById("archive-video");

    const videoList =
        document.getElementById("video-list");

    const playerSection =
        document.getElementById("player-section");

    const pageTitle =
        document.getElementById("page-title");


    /*
    Dừng video
    */

    video.pause();


    /*
    Xóa video hiện tại
    */

    video.removeAttribute("src");

    video.removeAttribute("poster");

    video.load();


    /*
    Hiện lại danh sách
    */

    playerSection.style.display = "none";

    videoList.style.display = "grid";


    /*
    Đổi tiêu đề
    */

    pageTitle.innerText =
        "Asian Dancer Exclusive";


    /*
    Về đầu trang
    */

    window.scrollTo(0, 0);

}

</script>
```
