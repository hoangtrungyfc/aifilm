<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Dancer - Hot Videos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #ff4757;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-sub {
            font-size: 14px;
            color: #aaa;
        }
        /* Style cho phần khung phát video responsive trên Mobile */
        #player-section {
            display: none;
            max-width: 800px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-responsive {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }
        .video-responsive video {
            width: 100%;
            max-height: 480px;
            display: block;
        }
        .back-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #ff6b81;
        }
        /* Tối ưu riêng cho màn hình điện thoại nhỏ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .video-responsive video {
                max-height: 320px;
            }
        }
    </style>
</head>
<body>

    <h1>Asian Dancer Exclusive</h1>
    
    <!-- Phần danh sách video dạng lưới -->
    <div class="grid-container" id="video-list">
        <!-- Video Item 1 (Gắn link .mp4 từ Archive.org của bạn vào đây) -->
        <div class="card" onclick="playVideo('ĐIỀN_LINK_MP4_TỪ_ARCHIVE_ORG_VÀO_ĐÂY')">
            <img src="https://picsum.photos/300/180?random=1" alt="Thumbnail">
            <div class="card-content">
                <div class="card-title">Bộ sưu tập Tập 1: Hot Cheerleader</div>
                <div class="card-sub">Xem ngay bản Full HD</div>
            </div>
        </div>
        <!-- Video Item 2 -->
        <div class="card" onclick="playVideo('ĐIỀN_LINK_MP4_TỪ_ARCHIVE_ORG_VÀO_ĐÂY')">
            <img src="https://picsum.photos/300/180?random=2" alt="Thumbnail">
            <div class="card-content">
                <div class="card-title">Bộ sưu tập Tập 2: Special Stage</div>
                <div class="card-sub">Xem ngay bản Full HD</div>
            </div>
        </div>
        <!-- Video Item 3 -->
        <div class="card" onclick="playVideo('ĐIỀN_LINK_MP4_TỪ_ARCHIVE_ORG_VÀO_ĐÂY')">
            <img src="https://picsum.photos/300/180?random=3" alt="Thumbnail">
            <div class="card-content">
                <div class="card-title">Bộ sưu tập Tập 3: Backstage Moments</div>
                <div class="card-sub">Xem ngay bản Full HD</div>
            </div>
        </div>
    </div>

    <!-- Khu vực hiển thị trình phát video (Mặc định ẩn, khi bấm vào card sẽ bật lên) -->
    <div id="player-section">
        <button class="back-btn" onclick="goBack()">⬅ Quay lại danh sách</button>
        <div class="video-responsive">
            <video id="archive-video" controls autoplay playsinline>
                <source id="video-source" src="" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
        </div>
    </div>

    <script>
        // Cờ lưu trạng thái để kích hoạt Smartlink Popunder 1 lần duy nhất mỗi phiên
        let clicked = false;
        const smartlinkURL = "https://YOUR_SMARTLINK_HERE"; // Nhớ thay link CrakRevenue của bạn vào đây

        function playVideo(mp4Url) {
            // 1. Kích hoạt Popunder Smartlink khi người dùng click
            if (!clicked) {
                window.open(smartlinkURL, '_blank');
                clicked = true;
            }

            // 2. Ẩn danh sách đi và hiện khung video lên ngay lập tức
            document.getElementById('video-list').style.display = 'none';
            let playerSection = document.getElementById('player-section');
            playerSection.style.display = 'block';

            // 3. Nạp link file .mp4 vào thẻ video và cho chạy
            let videoElement = document.getElementById('archive-video');
            document.getElementById('video-source').src = mp4Url;
            videoElement.load();
            videoElement.play();

            // 4. Cuộn màn hình lên đầu mượt mà trên mobile
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            // Đóng khung phát video, dừng video phát ngầm và hiện lại danh sách
            let videoElement = document.getElementById('archive-video');
            videoElement.pause();
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('video-list').style.display = 'grid';
        }
    </script>

</body>
</html>
