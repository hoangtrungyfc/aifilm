<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Dancer - Hot Videos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #ff4757;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-sub {
            font-size: 14px;
            color: #aaa;
        }
        /* Style cho phần khung phát video */
        #player-section {
            display: none;
            max-width: 800px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-responsive {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }
        .video-responsive video {
            width: 100%;
            max-height: 480px;
            display: block;
        }
        .back-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #ff6b81;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .video-responsive video {
                max-height: 320px;
            }
        }
    </style>
</head>
<body>

    <h1>Asian Dancer Exclusive</h1>
    
    <!-- Phần danh sách video dạng lưới -->
    <div class="grid-container" id="video-list">
        <!-- Video Item 1 -->
        <div class="card" onclick="playVideo('https://archive.org/download/1003-1_202610/1003%281%29.mp4', '1003.png')">
            <img src="1003.png" alt="Thumbnail">
            <div class="card-content">
                <div class="card-title">Bộ sưu tập Tập 1: Hot Cheerleader</div>
                <div class="card-sub">Xem ngay bản Full HD</div>
            </div>
        </div>
        <!-- Video Item 2 -->
        <div class="card" onclick="playVideo('https://archive.org/download/1003-1_202610/1003%281%29.mp4', '1003.png')">
            <img src="1003.png" alt="Thumbnail">
            <div class="card-content">
                <div class="card-title">Bộ sưu tập Tập 2: Special Stage</div>
                <div class="card-sub">Xem ngay bản Full HD</div>
            </div>
        </div>
        <!-- Video Item 3 -->
        <div class="card" onclick="playVideo('https://archive.org/download/1003-1_202610/1003%281%29.mp4', '1003.png')">
            <img src="1003.png" alt="Thumbnail">
            <div class="card-content">
                <div class="card-title">Bộ sưu tập Tập 3: Backstage Moments</div>
                <div class="card-sub">Xem ngay bản Full HD</div>
            </div>
        </div>
    </div>

    <!-- Khu vực hiển thị trình phát video (Nằm ngay trên tab chính) -->
    <div id="player-section">
        <button class="back-btn" onclick="goBack()">⬅ Quay lại danh sách</button>
        <div class="video-responsive">
            <video id="archive-video" controls autoplay playsinline>
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
        </div>
    </div>

    <script>
        let openedSmartlink = false;
        const smartlinkURL = "https://YOUR_SMARTLINK_HERE"; // Thay link CrakRevenue của bạn vào đây

        function playVideo(mp4Url, posterUrl) {
            // Mở Smartlink ngầm ở phía sau (Tab phụ nằm dưới) đúng 1 lần duy nhất mỗi phiên
            if (!openedSmartlink) {
                // Kỹ thuật mở tab mới nhưng focus/giữ lại tab cũ lên trên
                let popup = window.open(smartlinkURL, '_blank');
                if (popup) {
                    popup.blur();
                    window.focus(); // Ép tab hiện tại giữ nguyên phía trước mặt khách
                }
                openedSmartlink = true;
            }

            // Ẩn danh sách, hiện khung video mượt mà ngay tại trang chính
            document.getElementById('video-list').style.display = 'none';
            let playerSection = document.getElementById('player-section');
            playerSection.style.display = 'block';

            // Gán link video và ảnh poster để load không bị đen hình
            let videoElement = document.getElementById('archive-video');
            videoElement.src = mp4Url;
            videoElement.poster = posterUrl;
            videoElement.load();
            videoElement.play().catch(error => {
                console.log("Trình duyệt chặn autoplay:", error);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            // Dừng video và quay lại danh sách bình thường trên trang chính
            let videoElement = document.getElementById('archive-video');
            videoElement.pause();
            videoElement.src = ""; 
            videoElement.poster = ""; 
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('video-list').style.display = 'grid';
        }
    </script>

</body>
</html>
